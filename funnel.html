<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stimuler · Funnel Map</title>
<link rel="stylesheet" href="tokens.css">
<style>
/* ============ page chrome (light) ============ */
body{background:#F2F1F7;font-family:var(--font-body);color:#1B1826;}
.hdr{padding:26px 340px 4px 30px;}
.hdr h1{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-.02em;}
.hdr p{margin-top:4px;font-size:13.5px;color:#6B6680;max-width:70ch;}
.hdr b{color:#1B1826;}

/* ============ filmstrip ============ */
.strip{display:flex;align-items:flex-start;gap:0;overflow-x:auto;padding:18px 330px 46px 30px;}
.pgroup{flex:none;padding-right:34px;margin-right:34px;border-right:1.5px dashed #D8D5E6;}
.pgroup:last-child{border-right:none;}
.ptitle{font-family:var(--font-display);font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#8B85A3;margin:0 0 14px 2px;}
.ptitle span{color:#B9B4CC;font-weight:500;letter-spacing:0;text-transform:none;margin-left:8px;}
.prow{display:flex;gap:20px;}
.slot{flex:none;width:calc(390px * .56);cursor:zoom-in;}
.phwrap{width:390px;height:844px;transform:scale(.56);transform-origin:top left;}
.slot .ph-h{height:calc(844px * .56);}
.cap{margin-top:10px;font-size:11.5px;line-height:1.45;color:#6B6680;}
.cap .fl{font-family:var(--font-display);font-weight:600;color:#1B1826;font-size:12px;}
.cap .drv{display:inline-block;margin-left:6px;padding:1.5px 7px;border-radius:999px;background:rgba(240,163,47,.14);color:#B07A17;font-weight:600;font-size:10.5px;}

/* ============ phone frame ============ */
.phone-sm{width:390px;height:844px;border-radius:46px;background:#05040A;border:7px solid #17141F;box-shadow:0 24px 50px -22px rgba(15,12,30,.5);overflow:hidden;position:relative;}
.app-sm{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;color:var(--text-hi);}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:16px 24px 0;font-family:var(--font-display);font-weight:600;font-size:14px;flex:none;color:var(--text-hi);}
.statusbar .sb-r{display:flex;gap:6px;align-items:center;}
.home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:120px;height:4.5px;border-radius:3px;background:rgba(255,255,255,.32);}

/* ============ in-screen (ported from index.html) ============ */
.scr{flex:1;display:flex;flex-direction:column;min-height:0;padding:26px 24px 30px;position:relative;}
.scr.center{align-items:center;justify-content:center;text-align:center;}
.fprog{flex:none;margin-bottom:24px;}
.fprog i{transition:none;}
.fq{font-family:var(--font-display);font-weight:600;font-size:26px;line-height:1.22;letter-spacing:-.02em;color:var(--text-hi);}
.fq em{font-style:normal;color:var(--indigo-300);}
.fsub{margin-top:9px;font-size:15px;line-height:1.5;color:var(--text-mid);}
.opts{margin-top:22px;display:flex;flex-direction:column;gap:10px;overflow:hidden;}
.opt{flex:none;min-height:58px;padding:0 16px;gap:12px;background:rgba(255,255,255,.12);backdrop-filter:blur(26px) saturate(1.3);-webkit-backdrop-filter:blur(26px) saturate(1.3);border:1px solid rgba(255,255,255,.15);border-radius:18px;}
.opt.is-selected .t-option{color:#0D0B16;}
.qic{width:26px;flex:none;display:grid;place-items:center;}
.qic svg{width:22px;height:22px;}
.flag{font-size:20px;width:26px;text-align:center;flex:none;}
.fcta{margin-top:auto;padding-top:16px;display:flex;flex-direction:column;gap:6px;}
.fcta .btn{width:100%;}
.skip{align-self:center;background:none;color:var(--text-mid);font-weight:500;font-size:15px;min-height:40px;}
.ctx{align-items:center;text-align:center;}
.ctx .fq{text-align:center;}
.ctx .fsub{max-width:32ch;margin-left:auto;margin-right:auto;}
.cvis{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:14px 0;}
.statbars{display:flex;align-items:flex-end;gap:26px;height:150px;}
.statbars .col{display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;}
.statbars .bar{width:58px;border-radius:12px 12px 4px 4px;}
.statbars .b1{background:rgba(255,255,255,.14);}
.statbars .b2{background:linear-gradient(180deg,var(--indigo-300),var(--indigo-600));box-shadow:0 10px 30px -12px var(--indigo-glow);}
.statbars .blab{font-size:11.5px;color:var(--text-mid);}
.ba-card{width:100%;max-width:330px;border-radius:18px;padding:13px 14px;text-align:left;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);}
.ba-tag{font-family:var(--font-display);font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:9px;}
.ba-card.before .ba-tag{color:#E8968A;}
.ba-card.after .ba-tag{color:#7FD6AA;}
.bub{font-size:12px;padding:8px 11px;margin-bottom:6px;max-width:86%;border-radius:13px;line-height:1.45;}
.bub.them{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.1);border-bottom-left-radius:5px;color:var(--text-hi);}
.bub.mine{background:linear-gradient(135deg,var(--indigo-500),var(--indigo-600));color:#fff;margin-left:auto;border-bottom-right-radius:5px;}
.ba-card.before .bub.mine{background:rgba(255,255,255,.07);color:var(--text-mid);}
.ba-q{font-family:var(--font-display);font-weight:500;font-size:13.5px;line-height:1.4;color:var(--text-hi);text-align:center;max-width:280px;margin:0 auto 4px;}
.ba-card.before{filter:saturate(.7);}
.ba-card.after{border-color:rgba(108,99,255,.5);box-shadow:0 0 36px rgba(108,99,255,.16);background:rgba(108,99,255,.08);}
.ba-row{display:flex;align-items:center;gap:11px;}
.ba-fig{flex:none;width:50px;height:50px;display:grid;place-items:center;border-radius:13px;}
.ba-fig svg{width:40px;height:40px;}
.before .ba-fig{background:rgba(255,255,255,.05);}
.after .ba-fig{background:rgba(108,99,255,.16);box-shadow:0 0 22px rgba(108,99,255,.28);}
.ba-emo{font-family:var(--font-display);font-weight:600;font-size:12.5px;color:var(--text-hi);margin-bottom:2px;}
.before .ba-emo{color:#B7B2C8;}
.ba-quote{font-size:11.5px;line-height:1.45;color:var(--text-mid);}
.before .ba-quote{font-style:italic;color:var(--text-low);}
.after .ba-quote{color:var(--text-hi);}
.ba-pulse{width:100%;height:13px;margin-top:9px;display:block;}
.ba-pulse polyline{fill:none;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:6 4;}
.before .ba-pulse polyline{stroke:rgba(224,106,90,.7);}
.after .ba-pulse polyline{stroke:rgba(127,214,170,.75);}
.ba-testi{font-size:12.5px;color:var(--text-mid);max-width:300px;line-height:1.5;}
.ba-testi b{color:var(--gold-300);}
.feat-vid{height:100%;max-height:330px;aspect-ratio:886/1812;border-radius:24px;overflow:hidden;background:#000;box-shadow:0 26px 50px -22px rgba(0,0,0,.9),0 0 44px -12px var(--indigo-glow);}
.feat-vid video{width:100%;height:100%;object-fit:cover;}
.sci-badge{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:var(--r-pill);background:rgba(108,99,255,.12);border:1px solid rgba(139,132,255,.34);font-size:12.5px;font-weight:600;color:var(--indigo-300);}
.sci-src{font-size:11px;color:#585470;}
.wrapopt .t-option{white-space:normal;font-size:14.5px;line-height:1.3;}
.lv-badge{font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--indigo-300);width:30px;flex:none;}
.opt.is-selected .lv-badge{color:var(--indigo-600);}
.mins{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;width:100%;}
.mins .opt{min-height:52px;justify-content:center;text-align:center;}
.commit-graph{width:100%;max-width:330px;border-radius:18px;padding:14px 14px 8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);}
.commit-graph svg{width:100%;display:block;}
.cflag{font-family:var(--font-display);font-weight:600;font-size:12.5px;fill:var(--gold-300);}
.pace{font-size:13px;color:var(--text-mid);text-align:center;line-height:1.5;max-width:32ch;margin:2px auto 0;}
.mic-circle{width:120px;height:120px;border-radius:50%;background:linear-gradient(180deg,#fff,#EDEBF6);display:grid;place-items:center;box-shadow:0 0 0 14px rgba(255,255,255,.06),0 0 60px -8px rgba(245,244,250,.4);}
.mic-circle svg{width:48px;height:48px;color:#0D0B16;}
/* ack */
.ack-head{margin-top:14px;padding:0 8px;font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1.2;letter-spacing:-.025em;}
.ack-sub{padding:0 12px;margin-top:10px;font-size:14px;line-height:1.5;color:var(--text-mid);}
.wreath{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;min-height:0;}
.lau{width:52px;height:104px;}
.lau.rt{transform:scaleX(-1);}
.w-stars{color:var(--gold-500);font-size:15px;letter-spacing:3px;}
.w-num{margin-top:6px;font-family:var(--font-display);font-weight:700;font-size:34px;letter-spacing:-.02em;}
.w-lab{margin-top:6px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-300);line-height:1.5;}
.tmar{width:100%;overflow:hidden;margin-bottom:16px;}
.trow{display:flex;gap:12px;width:max-content;}
.tcard{width:238px;min-height:120px;flex:none;display:flex;flex-direction:column;background:var(--surface-1);border:1px solid var(--stroke);border-radius:16px;padding:16px;text-align:left;}
.tc-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--text-mid);}
.tc-stars{color:var(--gold-500);font-size:11px;letter-spacing:1.5px;}
.tc-t{margin-top:7px;font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--text-hi);}
.tc-b{margin-top:6px;font-size:12.5px;line-height:1.55;color:var(--text-mid);}
/* hero bits */
.beatp{font-family:var(--font-display);font-weight:600;font-size:28px;line-height:1.3;letter-spacing:-.02em;text-align:center;}
.beatp .em{color:var(--indigo-300);}
.beatp .soft{color:var(--text-mid);}
.gs-demo{flex:1;display:flex;align-items:flex-start;justify-content:center;padding-top:6px;min-height:0;}
.gs-vid{width:196px;aspect-ratio:886/1812;border-radius:26px;overflow:hidden;background:#000;box-shadow:0 34px 48px -18px rgba(0,0,0,.9),0 0 54px -14px var(--indigo-glow);}
.gs-vid video{width:100%;height:100%;object-fit:cover;}
.gs-sheet{flex:none;border-radius:34px 34px 0 0;margin:0 -24px -30px;padding:22px 28px 34px;background:linear-gradient(180deg,#1C1830,#120F22);border-top:1px solid rgba(139,132,255,.25);text-align:center;}
.gs-dots{display:flex;gap:6px;justify-content:center;margin-bottom:14px;}
.gs-dots .dot{width:22px;height:7px;border-radius:var(--r-pill);background:rgba(255,255,255,.16);}
.gs-dots .dot.on{background:var(--indigo-400);}
.gs-label{font-family:var(--font-body);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--indigo-300);}
.gs-head{margin:8px 0 18px;font-family:var(--font-display);font-weight:600;font-size:23px;line-height:1.25;letter-spacing:-.02em;}
.gs-head b{color:var(--indigo-300);font-weight:600;}
/* signup */
.su{background:#020108 radial-gradient(60% 30% at 50% 26%, rgba(108,99,255,.25), transparent 70%);}
.su-hero{width:86px;height:86px;margin:40px auto 0;}
.su-hero img{width:100%;height:100%;object-fit:contain;}
.su-title{margin-top:18px;text-align:center;font-family:var(--font-display);font-weight:700;font-size:24px;line-height:1.25;letter-spacing:-.02em;}
.su-btns{margin-top:auto;display:flex;flex-direction:column;gap:11px;}
.sso2{display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border-radius:999px;background:#fff;color:#131316;font-family:var(--font-display);font-weight:600;font-size:15.5px;}
.sso2 .ic{width:22px;height:22px;display:grid;place-items:center;}
.sso2 .ic svg{width:22px;height:22px;}
.su-terms{margin-top:16px;text-align:center;font-size:11.5px;line-height:1.6;color:var(--text-low);}
.su-terms b{color:var(--text-mid);}
/* phone q */
.phone-row{display:flex;gap:10px;margin-top:22px;}
.cc{flex:none;display:flex;align-items:center;gap:7px;padding:0 14px;min-height:56px;background:var(--surface-1);border:1.5px solid var(--stroke);border-radius:var(--r-md);font-size:16px;font-weight:500;}
.wa-chip{display:inline-flex;align-items:center;gap:7px;margin-top:12px;padding:7px 13px;border-radius:999px;background:rgba(67,214,160,.12);border:1px solid rgba(67,214,160,.3);color:var(--green);font-size:12.5px;font-weight:600;align-self:flex-start;}
.wa-chip svg{width:15px;height:15px;}
/* activation */
.coach{display:flex;align-items:center;gap:10px;margin-top:4px;}
.coach .av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--indigo-400),var(--indigo-700));display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:17px;color:#fff;flex:none;}
.coach .cn{font-family:var(--font-display);font-weight:600;font-size:14px;}
.coach .cr{font-size:12px;color:var(--text-mid);}
.saybub{margin-top:14px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);border-radius:18px;border-top-left-radius:6px;padding:14px 16px;font-size:16px;line-height:1.5;text-align:left;}
.modecard{margin-top:14px;width:100%;border-radius:16px;padding:13px 15px;text-align:left;background:rgba(108,99,255,.1);border:1px solid rgba(139,132,255,.3);}
.modecard .mtag{font-family:var(--font-display);font-weight:600;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--indigo-300);margin-bottom:7px;}
.modecard .mtxt{font-size:14px;line-height:1.55;color:var(--text-hi);}
.modecard .mtxt i{font-style:normal;color:var(--indigo-300);border-bottom:1.5px dashed var(--indigo-400);}
.holdhint{margin-top:10px;font-size:12.5px;color:var(--text-mid);text-align:center;}
.wave{display:flex;align-items:center;gap:4px;height:56px;}
.wave i{width:5px;border-radius:3px;background:var(--indigo-400);}
.timer{font-family:var(--font-display);font-weight:700;font-size:30px;letter-spacing:.02em;}
.stopbtn{width:74px;height:74px;border-radius:50%;background:linear-gradient(180deg,#fff,#EDEBF6);display:grid;place-items:center;box-shadow:0 0 0 12px rgba(255,255,255,.06);}
.stopbtn span{width:24px;height:24px;border-radius:6px;background:#E06A5A;display:block;}
/* score */
.ring{position:relative;width:150px;height:150px;}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);}
.ring .rnum{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:42px;letter-spacing:-.02em;}
.lensrow{width:100%;max-width:320px;display:flex;align-items:center;gap:10px;text-align:left;}
.lensrow .ln{flex:1;font-size:13.5px;color:var(--text-hi);}
.lensrow .lb{flex:none;width:96px;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;}
.lensrow .lb i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--indigo-500),var(--indigo-300));}
.conf{position:absolute;border-radius:50%;width:7px;height:7px;}
/* plan + paywall */
.eyebrow{font-family:var(--font-body);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-500);}
.wkcard{width:100%;border-radius:16px;padding:13px 15px;text-align:left;background:var(--surface-1);border:1px solid var(--stroke);display:flex;gap:12px;align-items:center;}
.wkcard .wn{flex:none;font-family:var(--font-display);font-weight:700;font-size:12px;color:var(--gold-300);width:52px;line-height:1.3;}
.wkcard .wt{font-size:14px;color:var(--text-hi);line-height:1.4;}
.goldline{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:999px;background:rgba(240,163,47,.12);border:1px solid rgba(240,163,47,.35);color:var(--gold-300);font-size:13px;font-weight:600;}
.loaderring{width:112px;height:112px;border-radius:50%;border:5px solid rgba(255,255,255,.1);border-top-color:var(--indigo-400);}
.chk{width:100%;max-width:300px;display:flex;gap:10px;align-items:flex-start;text-align:left;font-size:14px;color:var(--text-hi);line-height:1.4;}
.chk .c{flex:none;width:20px;height:20px;border-radius:50%;background:var(--green);display:grid;place-items:center;margin-top:1px;}
.chk .c svg{width:11px;height:11px;color:#06231A;}
.badge2{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);font-size:12px;font-weight:600;color:var(--text-hi);}
.letter{width:100%;border-radius:20px;padding:20px 18px;text-align:left;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);}
.letter .lh{font-family:var(--font-display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-300);}
.letter .lb2{margin-top:12px;font-size:15.5px;line-height:1.65;color:var(--text-hi);}
.letter .ls{margin-top:14px;font-size:13.5px;color:var(--text-mid);}
.fingerp{width:104px;height:104px;border-radius:50%;border:2px solid var(--indigo-400);display:grid;place-items:center;box-shadow:0 0 44px -6px var(--indigo-glow);}
.fingerp svg{width:46px;height:46px;color:var(--indigo-300);}
.pricecard{width:100%;border-radius:18px;padding:15px 16px;text-align:left;background:var(--surface-1);border:1.5px solid var(--stroke);position:relative;}
.pricecard.hot{border-color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.07));}
.pricecard .pt{font-family:var(--font-display);font-weight:600;font-size:15px;}
.pricecard .pp{margin-top:3px;font-size:13px;color:var(--text-mid);}
.pricecard .pp b{color:var(--text-hi);font-size:16px;}
.bvtag{position:absolute;top:-9px;right:14px;padding:3px 10px;border-radius:999px;background:linear-gradient(90deg,var(--gold-600),var(--gold-300));color:#241500;font-family:var(--font-display);font-weight:700;font-size:10px;letter-spacing:.08em;text-transform:uppercase;}
.strike{text-decoration:line-through;color:var(--text-low);}
.count{font-family:var(--font-display);font-weight:700;font-size:34px;letter-spacing:.03em;color:var(--gold-300);}
/* ============ rail ============ */
.rail{position:fixed;top:0;right:0;bottom:0;width:308px;background:#fff;border-left:1px solid #E4E2EF;padding:22px 20px 46px;overflow-y:auto;z-index:40;}
.rail h2{font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#8B85A3;margin-bottom:12px;}
.rail h2.mt{margin-top:24px;}
.pcard{width:100%;text-align:left;border:1.5px solid #E4E2EF;border-radius:14px;padding:10px 13px;margin-bottom:8px;background:#fff;transition:border-color .15s,background .15s;}
.pcard .pn{font-family:var(--font-display);font-weight:600;font-size:14.5px;color:#1B1826;}
.pcard .pm{margin-top:2px;font-size:11.5px;color:#8B85A3;line-height:1.45;}
.pcard.on{border-color:var(--indigo-500);background:rgba(108,99,255,.06);}
.pcard.on .pn{color:var(--indigo-600);}
.dial{margin-bottom:14px;}
.dial .dl{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#8B85A3;margin-bottom:7px;}
.dial .dw{display:flex;flex-wrap:wrap;gap:6px;}
.dchip{padding:6px 11px;border-radius:999px;border:1.5px solid #E4E2EF;background:#fff;font-size:12px;font-weight:500;color:#3A3550;transition:all .15s;}
.dchip.on{background:#17141F;border-color:#17141F;color:#fff;}
/* ============ lightbox ============ */
.lb{position:fixed;inset:0;background:rgba(15,12,30,.66);z-index:60;display:none;align-items:center;justify-content:center;cursor:zoom-out;}
.lb.open{display:flex;}
.lb .lbwrap{width:390px;height:844px;transform:scale(.82);transform-origin:center;}
.lb .lbwrap .opts{overflow-y:auto;}
</style>
</head>
<body>
<div class="hdr">
  <h1>Stimuler · Funnel Map</h1>

 {ph:'Intro',t:'Signup',r:d=>'<div class="scr su"><div class="su-hero"><img src="images/logo-stim.png"></div><h1 class="su-title">#1 AI app for<br>English fluency</h1><div class="su-btns"><button class="sso2"><span class="ic"><svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.8-.07-1.6-.2-2.3H12v4.5h6.5a5.6 5.6 0 0 1-2.4 3.7v3h3.9c2.3-2.1 3.5-5.2 3.5-8.9Z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-2.9l-3.9-3c-1.1.7-2.5 1.2-4.1 1.2-3.1 0-5.8-2.1-6.7-5H1.2v3.1A12 12 0 0 0 12 24Z"/><path fill="#FBBC05" d="M5.3 14.3a7.2 7.2 0 0 1 0-4.6V6.6H1.2a12 12 0 0 0 0 10.8l4.1-3.1Z"/><path fill="#EA4335" d="M12 4.7c1.8 0 3.3.6 4.6 1.8L20 3.1A12 12 0 0 0 1.2 6.6l4.1 3.1c.9-2.9 3.6-5 6.7-5Z"/></svg></span>Continue with Google</button><button class="sso2"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#1877F2"/><path d="M16.4 15.5l.53-3.47h-3.33V9.78c0-.95.47-1.88 1.96-1.88h1.51V4.95s-1.37-.23-2.69-.23c-2.74 0-4.53 1.66-4.53 4.66v2.65H6.8v3.47h3.05V24a12 12 0 0 0 3.75 0v-8.5h2.8Z" fill="#fff"/></svg></span>Login with Facebook</button><button class="sso2"><span class="ic"><svg viewBox="0 0 24 24" fill="none"><rect x="2.5" y="5" width="19" height="14" rx="2.5" fill="#E8E6F0"/><path d="M3.5 6.5 12 13l8.5-6.5" stroke="#131316" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Continue with Email</button></div><div class="su-terms">By tapping Continue, you agree to our<br><b>Terms</b> and <b>Privacy Policy</b></div></div>'},
 /* IDENTITY */
 {ph:'Identity',t:'Where did you hear about us?',r:d=>'<div class="scr">'+prog(8)+'<h2 class="fq">Where did you hear about us?</h2><div class="opts">'+ATTR.map((a,i)=>opt(a[1],{icon:a[0],sel:i===1})).join('')+'</div></div>'},
 {ph:'Identity',t:'Native language',r:d=>'<div class="scr">'+prog(15)+'<h2 class="fq">What\'s your native language?</h2><div class="opts">'+LANGROWS.map((l,i)=>opt(l[1],{flag:l[0],sel:i===0})).join('')+'</div></div>'},
 {ph:'Identity',t:'Peer-proof ack',drv:'language',r:d=>'<div class="scr ctx" style="padding-left:16px;padding-right:16px"><h2 class="ack-head">¡Perfecto! Estás en<br>muy buena compañía.</h2><p class="ack-sub">Miles de hispanohablantes pasan de entender inglés a <b style="color:var(--text-hi)">hablarlo con confianza</b>, empezando exactamente aquí.</p><div class="wreath">'+LAUREL+'<div class="w-mid"><div class="w-stars">★★★★★</div><div class="w-num">2,340,000+</div><div class="w-lab">hispanohablantes<br>aprendiendo inglés</div></div>'+LAUREL.replace('class="lau"','class="lau rt"')+'</div><div class="tmar"><div class="trow"><div class="tcard"><div class="tc-top"><span class="tc-stars">★★★★★</span><span>María R. · Houston 🇲🇽</span></div><div class="tc-t">Pasé mi entrevista en inglés</div><div class="tc-b">En 3 meses dejé de congelarme. Todo empezó aquí…</div></div><div class="tcard"><div class="tc-top"><span class="tc-stars">★★★★★</span><span>Diego A. · Miami 🇨🇴</span></div><div class="tc-t">Por fin me entienden</div><div class="tc-b">Mi pronunciación mejoró tanto que ya nadie me pide repetir.</div></div></div></div>'+cta('Continue →')+'</div>'},
 {ph:'Identity',t:'App language',r:d=>'<div class="scr">'+prog(22)+'<h2 class="fq">¿Prefieres la app<br>en <em>español</em>?</h2><p class="fsub">Las instrucciones aparecerán en tu idioma. El inglés que practicas sigue siendo 100% real.</p><div class="opts">'+opt('Sí, en español',{flag:'🇪🇸',sel:true})+opt('Keep it in English',{flag:'🇺🇸'})+'</div></div>'},
 {ph:'Identity',t:'Name',r:d=>'<div class="scr">'+prog(29)+'<h2 class="fq">What should we call you?</h2><p class="fsub">Your coach will use this name in every session.</p><input class="field" style="margin-top:22px" value="'+d.name+'">'+cta('Continue')+'</div>'},
 {ph:'Identity',t:'Nice to meet you',r:d=>'<div class="scr" style="justify-content:center;text-align:center"><div style="width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%, rgba(168,161,255,.4), rgba(108,99,255,.12) 70%);border:1.5px solid var(--indigo-500);display:grid;place-items:center;margin:0 auto 24px;box-shadow:0 0 44px var(--indigo-glow)"><svg viewBox="0 0 24 24" fill="currentColor" style="width:30px;height:30px;color:var(--indigo-300)"><path d="M12 2l2.2 6.4L21 10l-6.8 1.6L12 18l-2.2-6.4L3 10l6.8-1.6L12 2z"/></svg></div><h2 style="font-family:var(--font-display);font-weight:700;font-size:28px;line-height:1.2;letter-spacing:-.02em;color:var(--text-hi)">Nice to meet you,<br><em style="font-style:normal;color:var(--indigo-300)">'+d.name+'</em>.</h2><p style="margin:14px auto 0;font-size:15px;color:var(--text-mid);line-height:1.5;max-width:24ch">Sarah, your coach, will cheer you on by name in every session.</p></div>'},
 {ph:'Identity',t:'Age',r:d=>'<div class="scr">'+prog(36)+'<h2 class="fq">How old are you?</h2><div class="opts">'+['Under 18','18–24','25–34','35–44','45–54','55+'].map(a=>opt(a,{sel:a===d.age})).join('')+'</div></div>'},
 {ph:'Identity',t:'Gender',r:d=>'<div class="scr">'+prog(44)+'<h2 class="fq">How do you identify?</h2><div class="opts">'+['Male','Female','Non-binary','Prefer not to say'].map(g=>opt(g,{sel:g===d.gender})).join('')+'</div></div>'},
 {ph:'Identity',t:'Phone (skippable)',r:d=>'<div class="scr">'+prog(50)+'<h2 class="fq">Where can we<br>reach you?</h2><p class="fsub">Session reminders and your progress, right where you already are. No spam, ever.</p><div class="phone-row"><div class="cc"><span>🇺🇸</span> +1</div><input class="field" value="'+d.phone+'"></div><span class="wa-chip"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Z"/></svg> Works great with WhatsApp</span>'+cta('Continue','Skip for now')+'</div>'},
 /* MOTIVATION */
 {ph:'Motivation',t:'Occupation',r:d=>'<div class="scr">'+prog(56)+'<h2 class="fq">What do you do?</h2><p class="fsub">We\'ll build your practice around the conversations your day actually has.</p><div class="opts">'+OCCROWS.map(o=>opt(o[1],{icon:IC[o[0]],sel:o[0]===d.occ})).join('')+'</div></div>'},
 {ph:'Motivation',t:'Goal',r:d=>'<div class="scr">'+prog(62)+'<h2 class="fq">Why English,<br>why now?</h2><p class="fsub">We\'ll build your whole plan around this.</p><div class="opts">'+Object.keys(GOALS).map(g=>opt(GOALS[g].label,{icon:IC[g==='other'?'spark':g],sel:g===d.goal})).join('')+'</div></div>'},
 {ph:'Motivation',t:'Stat beat',drv:'occupation (ielts: goal)',r:d=>d.iel
   ?'<div class="scr ctx"><h2 class="fq">'+IELTS.stat.head+'</h2><div class="cvis"><div class="statbars"><div class="col"><div class="bar b1" style="height:'+IELTS.stat.bars[0]+'%"></div><span class="blab">'+IELTS.stat.labels[0]+'</span></div><div class="col"><div class="bar b2" style="height:'+IELTS.stat.bars[1]+'%"></div><span class="blab">'+IELTS.stat.labels[1]+'</span></div></div><p class="fsub">'+IELTS.stat.line+'</p></div>'+cta('Continue →')+'</div>'
   :'<div class="scr ctx"><h2 class="fq">Confident English changes what you earn.</h2><div class="cvis"><div class="statbars"><div class="col"><div class="bar b1" style="height:'+d.ind.bars[0]+'%"></div><span class="blab">Getting by</span></div><div class="col"><div class="bar b2" style="height:'+d.ind.bars[1]+'%"></div><span class="blab">Confident English</span></div></div><p class="fsub">'+d.ind.stat+'</p></div>'+cta('Continue →')+'</div>'},
 {ph:'Motivation',t:'Why IELTS',drv:'goal = ielts',only:'ielts',r:d=>'<div class="scr">'+prog(64)+'<h2 class="fq">Why are you<br>taking IELTS?</h2><div class="opts">'+IELTS.whyQ.opts.map(o=>opt(o.label,{icon:IC[o.val==='study'?'school':'career'],sel:o.val===d.reason})).join('')+'</div></div>'},
 {ph:'Motivation',t:'Reason ack',drv:'ielts reason',only:'ielts',r:d=>{const r=IELTS.reasons[d.reason]||IELTS.reasons.study;return '<div class="scr ctx"><h2 class="fq">'+r.ack.head+'</h2><p class="fsub">'+r.ack.sub+'</p><div class="cvis" style="gap:10px">'+r.ack.testis.map(t=>'<div class="tcard" style="width:100%"><div class="tc-top"><span class="tc-stars">★★★★★</span><span>'+t.name+' · '+t.city+'</span></div><div class="tc-b">'+t.quote+'</div></div>').join('')+'</div>'+cta('Continue →')+'</div>';}},
 {ph:'Motivation',t:'Exam date',drv:'ielts deadline',only:'ielts',r:d=>'<div class="scr">'+prog(66)+'<h2 class="fq">'+IELTS.examQ.head+'</h2><div class="opts">'+IELTS.examQ.opts.map(x=>opt(x.label,{sel:x.val===d.exp})).join('')+'</div></div>'},
 {ph:'Motivation',t:'Band target',drv:'ielts',only:'ielts',r:d=>'<div class="scr">'+prog(68)+'<h2 class="fq">What band are<br>you aiming for?</h2><p class="fsub">Your plan will aim exactly there.</p><div class="opts">'+[['6.0','Good enough to qualify'],['6.5','Most university programs'],['7.0','Competitive programs & visas'],['7.5+','Top schools and licensing']].map(b=>opt(b[1],{badge:b[0].replace('+',''),sel:b[0]===d.band})).join('')+opt('Not sure yet',{sel:false})+'</div></div>'},
 {ph:'Motivation',t:'JTBD drill',drv:'goal',not:'ielts',r:d=>'<div class="scr">'+prog(68)+'<h2 class="fq">Which conversation do you most want to <em>nail</em>?</h2><div class="opts">'+GOALS[d.goal].jtbd.map(j=>opt(j.label,{sel:j.id===d.jt.id})).join('')+'</div></div>'},
 {ph:'Motivation',t:'Before / After',drv:'family (ielts: band-stamped)',r:d=>{
   const themQ=(d.fam.before.find(b=>b[0]==='them')||[,'The question comes.'])[1];
   const meB=d.fam.before.filter(b=>b[0]==='me').map(b=>b[1]).join(' ');
   const meA=(d.fam.after.find(b=>b[0]==='me')||[,''])[1];
   return '<div class="scr ctx"><h2 class="fq">'+(d.iel?IELTS.ba.head:'Same question.<br>A different you.')+'</h2><div class="cvis"><p class="ba-q">“'+themQ+'”</p>'
   +'<div class="ba-card before"><div class="ba-tag">'+(d.iel?IELTS.ba.beforeTag:'Today')+'</div><div class="ba-row">'+'<span class="ba-fig"><svg viewBox="0 0 48 48" fill="none"><path d="M31.5 5.5l1.8-2.8M35.5 9l3-2M37 14l3.2-.6" stroke="#D07A6E" stroke-width="1.8" stroke-linecap="round"/><circle cx="27" cy="18.5" r="6.2" fill="#77738C"/><path d="M11 42c1.2-9.5 6.5-15 13.5-15.6C31.5 25.8 36.5 31 38.5 42H11Z" fill="#57536B"/></svg></span>'+'<div><div class="ba-emo">'+(d.iel?'Hesitating. The clock ticking.':'Heart racing. Words stuck.')+'</div><div class="ba-quote">“'+meB+'”</div></div></div>'+'<svg class="ba-pulse" viewBox="0 0 300 20" preserveAspectRatio="none"><polyline points="0,12 20,12 27,4 34,19 41,2 48,17 54,12 86,12 94,6 101,18 108,3 115,15 121,12 158,12 166,4 174,19 181,2 188,15 195,12 232,12 239,6 246,17 253,4 260,14 266,12 300,12"/></svg>'+'</div>'
   +'<div class="ba-card after"><div class="ba-tag">'+(d.iel?IELTS.ba.afterTag:'After Stimuler')+'</div><div class="ba-row">'+'<span class="ba-fig"><svg viewBox="0 0 48 48" fill="none"><circle cx="21" cy="14" r="6.2" fill="#A8A1FF"/><path d="M6.5 42c1.2-10 6.8-15.4 14.5-15.4S34.3 32 35.5 42H6.5Z" fill="#6C63FF" opacity=".85"/><path d="M32 11c2.6 1.6 2.6 5.2 0 6.8M36.5 8c4.2 2.7 4.2 9.6 0 12.3" stroke="#A8A1FF" stroke-width="1.8" stroke-linecap="round"/></svg></span>'+'<div><div class="ba-emo">'+(d.iel?'Flowing. The examiner nods.':'Calm. Clear. Understood.')+'</div><div class="ba-quote">“'+meA+'”</div></div></div>'+'<svg class="ba-pulse" viewBox="0 0 300 20" preserveAspectRatio="none"><polyline points="0,12 34,12 50,7 66,12 108,12 124,7 140,12 182,12 198,7 214,12 256,12 272,7 288,12 300,12"/></svg>'+'</div>'
   +'<p class="ba-testi">★★★★★ "'+d.fam.testi.quote+'" <b>'+d.fam.testi.name+' · '+d.fam.testi.city+'</b></p></div>'+cta('Continue →')+'</div>';}},
 {ph:'Motivation',t:'Skill',drv:'ielts: examiner criteria',r:d=>'<div class="scr">'+prog(74)+'<h2 class="fq">'+(d.iel?IELTS.skillQ.head:'What should we<br>sharpen first?')+'</h2>'+(d.iel?'<p class="fsub">'+IELTS.skillQ.sub+'</p>':'')+'<div class="opts">'+Object.keys(SKILLS).map(s=>opt(d.iel?IELTS.skillQ.labels[s]:SKLABEL[s],{icon:IC[s],sel:s===d.skill})).join('')+'</div></div>'},
 {ph:'Motivation',t:'Feature intro',drv:'skill',r:d=>'<div class="scr ctx"><h2 class="fq">'+(d.iel?IELTS.featHead:'Built for exactly that.')+'</h2><div class="cvis"><div class="feat-vid"><video src="'+d.sk.video+'" muted autoplay loop playsinline></video></div><p class="fsub">'+(d.iel?IELTS.featIntro[d.skill]:d.sk.intro)+'</p></div>'+cta('Continue →')+'</div>'},
 {ph:'Motivation',t:'Level',r:d=>'<div class="scr">'+prog(80)+'<h2 class="fq">How would you describe your current level?</h2><div class="opts wrapopt">'+LEVELS.map(l=>opt(l.desc,{badge:l.label,sel:l.id===d.level})).join('')+'</div></div>'},
 {ph:'Motivation',t:'Science beat',r:d=>'<div class="scr ctx"><h2 class="fq">Proven in<br>published research</h2><div class="cvis"><div style="font-family:var(--font-display);font-weight:700;font-size:64px;letter-spacing:-.03em;line-height:1;color:var(--indigo-300)">4×</div><p class="fsub" style="margin-top:2px"><b style="color:var(--text-hi)">faster speaking improvement</b> than conventional classes</p><div class="statbars" style="height:110px;margin-top:8px"><div class="col"><div class="bar b1" style="height:24%"></div><span class="blab">Regular classes +3.9</span></div><div class="col"><div class="bar b2" style="height:92%"></div><span class="blab">Stimuler +15.1</span></div></div><span class="sci-badge">Peer-reviewed · 4-week study</span><span class="sci-src">Denistiani (2025), MATCHA Journal · DOI: 10.70152/matcha.v1i1.135</span></div>'+cta('Continue →')+'</div>'},
 {ph:'Motivation',t:'Progress expectation',not:'ielts',r:d=>'<div class="scr">'+prog(86)+'<h2 class="fq">How soon do you want to see progress?</h2><div class="opts">'+[['week','Within a week'],['month','Within a month'],['halfyear','In 6 months'],['year','Within a year']].map(x=>opt(x[1],{sel:x[0]===d.exp})).join('')+'</div></div>'},
 {ph:'Motivation',t:'Daily commitment',drv:'goal + expectation',r:d=>'<div class="scr">'+prog(92)+'<h2 class="fq">How much will you practice daily?</h2><div class="cvis" style="justify-content:flex-start;padding-top:18px"><div class="commit-graph">'+commitSvg(d.minutes,d.flag,d.wks)+'</div><p class="pace">'+(d.iel?IELTS.paceNote(d.exp,d.wks):'You wanted progress '+EXPLABEL[d.exp]+'. This pace gets you there in ~'+d.wks+' week'+(d.wks>1?'s':'')+'.')+'</p><div class="mins">'+COMMIT.minutes.map(m=>'<button class="opt'+(m===d.minutes?' is-selected':'')+'"><span class="t-option">'+m+' min</span></button>').join('')+'</div></div>'+cta('Continue →')+'</div>'},
 {ph:'Motivation',t:'Mic ask',drv:'jtbd',r:d=>'<div class="scr ctx"><h2 class="fq">Let\'s practice: '+d.jt.label.toLowerCase()+'.</h2><p class="fsub">Sarah will ask you one question. Just speak.</p><div class="cvis"><div class="mic-circle">'+MICSVG+'</div></div>'+cta('Allow microphone','Not now')+'</div>'},
 /* ACTIVATION */
 {ph:'Activation',t:'Activation prompt',drv:'family + level + occupation',r:d=>{
   const q=d.fam.act.question.replace('{industry}',d.ind.slot);
   let modeblk='';
   if(d.mode==='read')modeblk='<div class="modecard"><div class="mtag">Read this aloud</div><div class="mtxt">"'+d.fam.act.model.replace('{industry}',d.ind.slot)+'"</div></div>';
   else if(d.mode==='hint')modeblk='<div class="modecard"><div class="mtag">Need a start? Use the hint</div><div class="mtxt">'+d.fam.act.hint.replace(/__/g,'<i>____</i>')+'</div></div>';
   else modeblk='<p class="fsub" style="margin-top:14px">Answer in your own words. There is no wrong answer.</p>';
   return '<div class="scr"><span class="eyebrow">Your first practice</span><div class="coach" style="margin-top:16px"><span class="av">S</span><div><div class="cn">Sarah</div><div class="cr">your speaking coach</div></div></div><div class="saybub">'+q+'</div>'+modeblk+'<div class="fcta" style="align-items:center"><div class="mic-circle" style="width:92px;height:92px">'+MICSVG.replace('width:48px','')+'</div><p class="holdhint">Tap to answer</p></div></div>';}},
 {ph:'Activation',t:'Listening',r:d=>'<div class="scr ctx"><span class="eyebrow">Your first practice</span><h2 class="fq" style="margin-top:14px">Sarah is listening…</h2><div class="cvis"><div class="wave">'+WAVE_H.map(h=>'<i style="height:'+h+'px"></i>').join('')+'</div><div class="timer">0:12</div><p class="fsub">Take your time. Pauses are fine.</p></div><div class="fcta" style="align-items:center"><div class="stopbtn"><span></span></div><p class="holdhint">Tap when you finish</p></div></div>'},
 {ph:'Activation',t:'Score reveal',drv:'skill + family',r:d=>{
   const pts=d.sk.lens.points,vals=[72,58,81];
   return '<div class="scr ctx"><span class="eyebrow">'+d.sk.lens.headline+'</span><div class="cvis"><div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="8"/><circle cx="50" cy="50" r="44" fill="none" stroke="url(#rg)" stroke-width="8" stroke-linecap="round" stroke-dasharray="199 277"/><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6C63FF"/><stop offset="1" stop-color="#FFC96E"/></linearGradient></defs></svg><div class="rnum">72</div></div>'+pts.map((p,i)=>'<div class="lensrow"><span class="ln">'+p+'</span><span class="lb"><i style="width:'+vals[i]+'%"></i></span></div>').join('')+'<p class="fsub" style="margin-top:6px">That was a real rep of <b style="color:var(--text-hi)">'+d.fam.label+'</b>. Imagine week three.</p></div>'+cta('Build my plan →')+'</div>';}},
 /* PLAN & PAYWALL */
 {ph:'Plan & Paywall',t:'Personalization loader',drv:'jtbd',r:d=>'<div class="scr ctx"><div class="cvis"><div class="loaderring"></div><h2 class="fq" style="font-size:22px">Building '+d.name+'\'s plan…</h2>'+chkrow('Analyzing your speaking sample')+chkrow('Building '+d.jt.label.toLowerCase()+' scenarios')+chkrow('Calibrating your '+d.minutes+' min/day pace')+'<span class="badge2">Google Play · Best AI Software 2023</span></div></div>'},
 {ph:'Plan & Paywall',t:'Plan reveal',drv:'goal (ielts: + band)',r:d=>'<div class="scr ctx"><span class="eyebrow">Your plan</span><h2 class="fq" style="margin-top:8px">'+(d.iel?IELTS.planTitle(d.name,d.band):PLANS[d.goal].title.replace('{name}',d.name))+'</h2><div class="cvis" style="gap:10px">'+PLANS[d.goal].weeks.map((w,i)=>'<div class="wkcard"><span class="wn">WEEK '+(i+1)+(i===2?'+':'')+'</span><span class="wt">'+w+'</span></div>').join('')+'<span class="goldline">~'+d.wks+' week'+(d.wks>1?'s':'')+' to '+d.flag+'</span></div>'+cta('I\'m ready →')+'</div>'},
 {ph:'Plan & Paywall',t:'Future-me letter',drv:'goal',r:d=>'<div class="scr ctx"><div class="cvis"><div class="letter"><div class="lh">A note from future '+d.name+'</div><div class="lb2">"'+LETTERS[d.goal]+'"</div><div class="ls">— '+d.name+', '+d.wks+' week'+(d.wks>1?'s':'')+' from now</div></div></div>'+cta('Make it real →')+'</div>'},
 {ph:'Plan & Paywall',t:'Fingerprint pledge',drv:'expectation',r:d=>'<div class="scr ctx"><h2 class="fq">Make it a promise.</h2><p class="fsub">I, '+d.name+', will practice '+d.minutes+' minutes a day.</p><div class="cvis"><div class="fingerp">'+IC.finger+'</div><p class="holdhint">Hold to sign</p></div><div class="fcta"><button class="skip">Not yet</button></div></div>'},
 {ph:'Plan & Paywall',t:'Price anchor',r:d=>'<div class="scr ctx"><h2 class="fq">What this costs<br>anywhere else</h2><div class="cvis" style="gap:10px"><div class="pricecard"><div class="pt">Private tutor</div><div class="pp"><b>$40</b> /hour · $480+ per month</div></div><div class="pricecard hot"><div class="pt" style="color:#fff">Sarah, your AI coach</div><div class="pp"><b>less than $0.30</b> /day · anytime, zero judgment</div></div><p class="fsub">Same speaking practice. A fraction of the price.</p></div>'+cta('Continue →')+'</div>'},
 {ph:'Plan & Paywall',t:'Paywall (hard)',drv:'goal + skill + jtbd',r:d=>'<div class="scr"><span class="eyebrow">One plan, everything</span><h2 class="fq" style="margin-top:8px">Unlock '+d.name+'\'s plan</h2><div style="margin-top:14px;display:flex;flex-direction:column;gap:8px">'+chkrow('Unlimited speaking practice with Sarah')+chkrow(SKLABEL[d.skill]+' feedback on every answer')+chkrow('Scenarios for '+d.jt.label.toLowerCase())+chkrow('Progress you can see, week by week')+'</div><div style="margin-top:18px;display:flex;flex-direction:column;gap:12px"><div class="pricecard hot"><span class="bvtag">Best value</span><div class="pt" style="color:#fff">Yearly</div><div class="pp"><b>$59.99</b> /year · works out to $5 a month</div></div><div class="pricecard"><div class="pt">Monthly</div><div class="pp"><b>$12.99</b> /month · cancel anytime</div></div></div><div class="fcta"><button class="btn">Start my plan</button><p class="holdhint">Placeholder pricing · final numbers TBD</p></div></div>'},
 {ph:'Plan & Paywall',t:'Exit offer',drv:'ielts: urgency copy',r:d=>'<div class="scr ctx"><h2 class="fq">Wait, '+d.name+'…</h2><p class="fsub">'+(d.iel?'Your exam date won\'t wait. Your plan is ready now.':'Your plan stays saved. This price does not.')+'</p><div class="cvis"><span class="goldline">One time only · 40% off</span><div class="pricecard hot" style="max-width:320px"><span class="bvtag">40% off</span><div class="pt" style="color:#fff">Yearly</div><div class="pp"><b>$35.99</b> /year · <span class="strike">$59.99</span></div></div><div class="count">14:59</div><p class="fsub">Offer expires when the timer does.</p></div>'+cta('Claim 40% off','Let the plan go')+'</div>'}
];

/* ---------------- build strip ---------------- */
const strip=document.getElementById('strip');
let curLB=-1,CUR=[];
function frameHTML(i,d){return '<div class="phone-sm"><div class="app-sm app-canvas">'+SB+CUR[i].r(d)+'<div class="home-ind"></div></div></div>';}
function buildStrip(){
 const d=D();
 CUR=SCREENS.filter(s=>!(s.only==='ielts'&&!d.iel)&&!(s.not==='ielts'&&d.iel));
 document.getElementById('floorCount').textContent=CUR.length;
 let html='',lastPh='';
 CUR.forEach((s,i)=>{
  if(s.ph!==lastPh){if(lastPh)html+='</div></div>';const n=CUR.filter(x=>x.ph===s.ph).length;html+='<div class="pgroup"><div class="ptitle">'+s.ph+'<span>'+n+' floors</span></div><div class="prow">';lastPh=s.ph;}
  html+='<div class="slot" data-i="'+i+'"><div class="ph-h"><div class="phwrap" id="fr'+i+'">'+frameHTML(i,d)+'</div></div><div class="cap"><span class="fl">'+(i+1)+' · '+s.t+'</span>'+(s.drv?'<span class="drv">← '+s.drv+'</span>':'')+'</div></div>';
 });
 html+='</div></div>';strip.innerHTML=html;
 strip.querySelectorAll('.slot').forEach(sl=>sl.addEventListener('click',()=>openLB(+sl.dataset.i)));
}
function rerender(){
 const keep=strip.scrollLeft;
 buildStrip();
 strip.scrollLeft=keep;
 if(curLB>=0){
  if(curLB<CUR.length)document.getElementById('lbwrap').innerHTML=frameHTML(curLB,D());
  else{lb.classList.remove('open');curLB=-1;}
 }
}
/* lightbox */
const lb=document.getElementById('lb');
function openLB(i){curLB=i;document.getElementById('lbwrap').innerHTML=frameHTML(i,D());lb.classList.add('open');}
lb.addEventListener('click',()=>{lb.classList.remove('open');curLB=-1;});

/* ---------------- rail ---------------- */
const pList=document.getElementById('pList'),dialsEl=document.getElementById('dials');
function buildRail(){
 pList.innerHTML=PERSONAS.map(p=>'<button class="pcard'+(state.persona===p.key?' on':'')+'" data-p="'+p.key+'"><div class="pn">'+p.name+'</div><div class="pm">'+p.meta+'</div></button>').join('');
 pList.querySelectorAll('.pcard').forEach(b=>b.addEventListener('click',()=>{const p=PERSONAS.find(x=>x.key===b.dataset.p);state={...p,persona:p.key};buildRail();rerender();}));
 const dial=(label,key,items)=>'<div class="dial"><div class="dl">'+label+'</div><div class="dw">'+items.map(it=>'<button class="dchip'+(state[key]===it[0]?' on':'')+'" data-k="'+key+'" data-v="'+it[0]+'">'+it[1]+'</button>').join('')+'</div></div>';
 const iel=state.goal==='ielts';
 dialsEl.innerHTML=
  dial('Goal','goal',Object.keys(GOALS).map(g=>[g,GOALS[g].label]))+
  (iel?dial('IELTS reason','reason',IELTS.whyQ.opts.map(o=>[o.val,o.label])):dial('Conversation (JTBD)','jtbd',GOALS[state.goal].jtbd.map(j=>[j.id,j.label])))+
  dial('Occupation','occ',OCCROWS)+
  dial('Skill','skill',Object.keys(SKILLS).map(s=>[s,SKLABEL[s]]))+
  dial('Level','level',LEVELS.map(l=>[l.id,l.id+' · '+l.mode]))+
  dial(iel?'Exam date':'Wants progress','exp',iel?[['week','2 weeks'],['month','1 month'],['halfyear','2–3 months'],['year','Not booked']]:[['week','1 week'],['month','1 month'],['halfyear','6 months'],['year','1 year']])+
  (iel?dial('Band target','band',IELTS.bands.map(b=>[b,b])):'');
 dialsEl.querySelectorAll('.dchip').forEach(c=>c.addEventListener('click',()=>{
  state[c.dataset.k]=c.dataset.v;state.persona=null;
  if(c.dataset.k==='goal'&&!GOALS[state.goal].jtbd.some(j=>j.id===state.jtbd))state.jtbd=GOALS[state.goal].jtbd[0].id;
  if(state.goal==='ielts'){state.reason=state.reason||'study';state.band=state.band||'7.0';}
  buildRail();rerender();
 }));
}
buildStrip();buildRail();
</script>
